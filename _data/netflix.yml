# TidyWL for Netflix — the few facts the /netflix/ pages read.
#
# `published` is the switch — the header CTA, the hero buttons and the footer
# link all come back from this one value. It was flipped on 2026-09-21, the day
# Google approved the listing.
#
# It exists because a draft item's public URL answers 200 while serving Chrome's
# empty shell (/detail/empty-title/<id>), so before approval an install button
# would have been a dead button on the primary call to action. Set it back to
# false if the listing is ever pulled.
#
# Everything else on those pages that could go stale (version, policy date) is
# here for the same reason: one place to change, not five.

published: true
store_url: https://chromewebstore.google.com/detail/tidywl-for-netflix/gbgdgeamachehbegdghnhpkiebahmafm
version: 0.1.0

# The date the privacy policy last changed, rendered on the page and used as
# its `last_modified_at`. Bump it when the policy's substance changes — not
# for a typo, per the freshness rule in CLAUDE.md.
privacy_updated: 2026-09-21
