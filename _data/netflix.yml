# TidyWL for Netflix — the few facts the /netflix/ pages read.
#
# `published` is the switch — the header CTA, the hero buttons and the footer
# link all come back from this one value. It was flipped on 2026-09-21, the day
# Google approved the listing.
#
# It exists because a draft item's public URL answers 200 while serving Chrome's
# empty shell (/detail/empty-title/<id>), so before approval an install button
# would have been a dead button on the primary call to action. Set it back to
# false if the listing is ever pulled.
#
# Everything else on those pages that could go stale (version, policy date) is
# here for the same reason: one place to change, not five.

published: true
store_url: https://chromewebstore.google.com/detail/watch-later-tidy-for-netf/gbgdgeamachehbegdghnhpkiebahmafm
version: 1.4.0

# The date the privacy policy last changed. A record only: nothing reads it
# (checked 2026-10-10). The sitemap's date comes from `last_modified_at` in
# netflix/privacy/index.html's front matter, which Liquid cannot fill from
# here, so bump both by hand when the policy's substance changes — not for a
# typo, per the freshness rule in CLAUDE.md.
privacy_updated: 2026-10-18
# The day the policy first went live. Rendered as "Published"; never bumped.
privacy_published: 2026-09-20

# Pro's free trial, in days, while Paddle runs one on both Netflix prices. The
# Pro page's closing words read it; absent means no trial is promised. Set on
# release day, after the trial is on in Paddle (PLAN-1.1.0 decision 23).
trial_days: 7
