# Settings for the "More from the community" marquee on the landing page.
#
# The marquee shows every written Chrome Web Store review in _data/cws-reviews.json, which
# .github/workflows/update-cws-rating.yml refreshes every Sunday (scripts/fetch-cws-reviews.mjs). Never hand-edit
# that file: the next run overwrites it. Adjust what it shows here instead.
#
# These settings are applied when the page is BUILT, so an edit here takes effect on the next push — you do not have
# to wait for Sunday. That matters for `hide`.
#
# The featured carousel above the marquee still comes from _data/reviews.yml, hand-picked. A review featured there is
# left out of the marquee automatically, so nothing appears twice.

# Reviews with fewer stars than this are left out.
min_stars: 4

# Reviews shorter than this many characters are left out. One-word reviews ("Great") dilute the rest (2026-09-16).
min_length: 25

# At most this many store reviews, newest first. Once the marquee runs, every card is on the page twice (the loop
# needs a second copy), so this keeps the page light as reviews pile up.
max_shown: 60

# Reviews never to show. Use it for anything offensive, spam, or a review that names a private person.
# The id is the "id" field in cws-reviews.json — also the UUID at the end of the review's store link.
#
# This list is applied at BUILD time, so it stops a review reaching the page and llms.txt, but the text still sits
# in cws-reviews.json, which is committed to a PUBLIC repo. When the point is that the text must not be published
# at all, add the id to EXCLUDE_IDS in scripts/fetch-cws-reviews.mjs as well, so it never enters the file. Keep it
# here too: the two nets catch different things, and this is where a human looks for the decision.
#
# Neither list is a star filter. A low rating is not grounds for hiding a review; the min_stars floor above is what
# decides which ratings the marquee quotes.
hide:
  - b2a44f4d-3ca3-459b-9269-c09462e7971e   # Juan David Reyes Lopez: points at a demo video the desktop page no longer has (2026-09-16); restore with the video
  - b1ac1959-3678-4a98-8990-da0b25079a88   # 1 star, 2026-09-17: the only one of five coordinated ratings that carried text; reported to Google, ticket 9-9562000041973. Also in EXCLUDE_IDS, so it should not reach the file at all. This repo is public, so neither list records the account or the text — the private evidence does.
#  - 00000000-0000-0000-0000-000000000000   # why

# Where Google guessed a review's language wrong. Sets the card's lang attribute (screen-reader voice, fonts) and label.
lang:
  ccf462ee-f776-411e-aed9-7abcfc87c933: ru   # Nikita Yasnov, 2026-07-31: Russian slang, tagged Bulgarian

# The label on a card written in another language. A code missing here shows as the code itself, upper-cased.
labels:
  ar: العربية
  bg: Български
  cs: Čeština
  de: Deutsch
  el: Ελληνικά
  es: Español
  fa: فارسی
  fr: Français
  he: עברית
  hi: हिन्दी
  hu: Magyar
  id: Bahasa Indonesia
  it: Italiano
  ja: 日本語
  ko: 한국어
  nl: Nederlands
  pl: Polski
  pt: Português
  ro: Română
  ru: Русский
  sv: Svenska
  th: ไทย
  tr: Türkçe
  uk: Українська
  vi: Tiếng Việt
  zh: 中文
