# Paddle client-side token for the live account, read by /pricing/ to initialise
# Paddle.js. Created 2026-09-10 as "tidywl.com pricing page".
#
# This is NOT a secret. A client-side token is designed to ship in page source —
# it can open a checkout and read prices, and nothing else. The secret API key
# (pdl_live_apikey_…) lives only in the Worker's secret store and must never
# appear in this repo. If you are ever unsure which you are holding: a token
# starts `live_`, a secret key starts `pdl_live_apikey_`.
#
# Replace the placeholder below with the value from Paddle → Developer tools →
# Authentication → Client-side tokens. Leaving it as the placeholder is safe:
# /pricing/ falls back to its current behaviour and renders no checkout.
clientToken: "live_ed1c25007f1bd7499e58a433e2e"

# Live price ids, mirrored from tidywl-api/wrangler.toml [vars]. Product
# pro_01m27g0h6stp4krnn3r5gw2den, created 2026-09-10.
# These are public identifiers, not credentials.
prices:
  monthly: "pri_01m27g0hcg1nm72s246fx7j732"
  yearly: "pri_01m27g0hjebrd1h1c82nsz8bwc"

# The master switch for the buy button on /pricing/.
#
# false  -> the Pro button stays "Available with version 2.0", disabled. Paddle.js
#           is not loaded at all, so the page ships no third-party script.
# true   -> the button opens a real Paddle checkout and takes real money.
#
# On since 2026-09-14, the day v2.0.0 went live on the Chrome Web Store
# (`1f6a3af`). The page and llms.txt say Pro is on sale. If this is ever switched
# off again, flip these back in the same commit or the site contradicts itself:
# pricing/index.html's .pro-status line, its .plans-foot sentence ("Nothing is
# charged until…"), and llms.txt. `4ee2bcd` / `e684f5b` are a worked pair.
onSale: true

# TidyWL for Netflix Pro — a separate product in the same Paddle account, read by
# /netflix/pricing/. Product pro_01m3fntam7mwsf1nvh2c8tjshj, created 2026-09-26;
# mirrored from tidywl-api/wrangler.toml [vars] PADDLE_NETFLIX_PRICE_*, which must
# be deployed before this switch is on — a Netflix price the Worker does not know
# would mint a YouTube key. The founding discount lives in
# /config/netflix-config-v1.json (pro.pricing.discount.paddleDiscountId).
#
# onSale is on while /netflix/pricing/ is unlinked and noindex, for the owner's
# test purchase (the user's yes, 2026-09-26). Link the page, and say "on sale"
# on it, only once 1.0.0 is on the Chrome Web Store.
netflix:
  onSale: true
  prices:
    monthly: "pri_01m3fnv4jzzk0w4fmpc7yqxk63"
    yearly: "pri_01m3fnvpemk4ar64s7zdrvk3nz"
