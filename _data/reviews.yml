# Reviews — single source of truth for BOTH the visible cards in index.html and
# the JSON-LD `review` array in its <head>. Adding a review is an entry here,
# never HTML surgery.
#
# THIS FILE MUST BE A BARE TOP-LEVEL SEQUENCE. Nest it under a `reviews:` key
# and `site.data.reviews` becomes a Hash: every loop silently renders zero
# cards, and Jekyll reports no error at all. Only the count-parity check catches
# it — see CLAUDE.md.
#
# Fields
#   quote        (required) Verbatim review text, WITHOUT surrounding quote
#                marks — the template adds them. Elide with [...], never
#                paraphrase. Escape any internal " as \" in double-quoted YAML.
#   author       (required) Display name exactly as shown on the source.
#   rating       (optional) Integer 1-5. OMIT for sources with no star rating
#                (YouTube comments). Entries without a rating are excluded from
#                JSON-LD: schema.org Review requires reviewRating, and emitting
#                one without it produces a GSC "Missing field" warning.
#   source       (required) Short label: "Chrome Web Store", "YouTube".
#   source_long  (optional) Link text on featured cards. Defaults to `source`.
#   url          (optional) Permalink to the INDIVIDUAL review. Omit rather than
#                pointing at the generic store listing — Review.url must resolve
#                to the review itself.
#   date         (optional) "YYYY-MM-DD", QUOTED so YAML keeps it a string.
#                Emitted as datePublished. Only set it if the date is real;
#                never backfill a guess into structured data.
#   featured     (optional) true -> big carousel card. Otherwise -> wall of love.
#                KEEP FEATURED QUOTES UNDER ~200 CHARACTERS: the carousel track
#                is a single flex line, so every card is as tall as the longest.

