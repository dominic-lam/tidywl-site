title: TidyWL
description: Free extension for Chrome, Edge and Firefox that cleans up YouTube Watch Later. Bulk-delete videos, filter and sort, download transcripts, and stay under YouTube's hidden 5,000-video cap.
url: https://tidywl.com
baseurl: ""

permalink: /blog/:slug/

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: /blog/feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # The phone app is noindex and has no front matter, so Jekyll copies it as it is and the sitemap
  # would list it anyway. Search Console reported a noindex page in the sitemap (2026-10-12).
  - scope:
      path: "netflix/app"
    values:
      sitemap: false

# Jekyll drops underscore-prefixed files by default. `_headers` is Cloudflare
# Pages config (the .xpi MIME type) and must reach _site or Firefox installs
# arrive as octet-stream and merely download instead of prompting to install.
include:
  - _headers

exclude:
  - .claude
  - .idea
  - CLAUDE.md
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts          # the weekly review fetcher and its tests; nothing a visitor needs
  - docs             # internal notes. Jekyll serves a .md here BOTH raw and rendered, so without this a
                     # debrief or plan would be live on tidywl.com (found 2026-09-17)
  - netflix/app/lib/jsqr/README.md   # a provenance note for the repo; Jekyll rendered it as a public page and listed it in the sitemap
  - "*.af"
  - "*.af~lock~"
  - _site

keep_files:
  - .git
