  <style>
    /* ── THEME TOKENS ── */
    :root {
      --bg: #faf4eb;
      --bg-alt: #f3ebdd;
      --bg-card: #ffffff;
      --text: #2a231d;
      --text-secondary: #4f443a;
      --text-muted: #6d5d4f;
      --text-subtle: #a8968a;
      --border: #d9cdbd;
      --border-subtle: #ece1cf;
      --border-strong: #b8a58e;
      --accent: #e63935;
      --accent-hover: #cc2e2a;
      --star: #d99a1a;
      --stars-empty: #c4b5a3;
      --highlight-bg: linear-gradient(180deg, #fff3f2 0%, #ffffff 100%);
      --highlight-border: #e9a8a6;
      --ghost-hover-bg: #f3ebdd;
      --ghost-hover-border: #8a7863;
      --feature-icon-bg: rgba(230, 57, 53, 0.08);
      --shadow-accent: 0 24px 80px -32px rgba(230, 57, 53, 0.18);
    }

    /* Follow OS dark mode unless user forced light */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1c1a18;
        --bg-alt: #161412;
        --bg-card: #24211e;
        --text: #f5efe7;
        --text-secondary: #c9bfb4;
        --text-muted: #a89f97;
        --text-subtle: #8a807a;
        --border: #3a342f;
        --border-subtle: #2a2724;
        --border-strong: #4a433c;
        --star: #ffb400;
        --stars-empty: #6d655f;
        --highlight-bg: linear-gradient(180deg, #2a1c1a 0%, #24211e 100%);
        --highlight-border: #4a2a27;
        --ghost-hover-bg: #24211e;
        --ghost-hover-border: #6d655f;
      }
    }

    /* Manual override wins over OS preference */
    :root[data-theme="dark"] {
      --bg: #1c1a18;
      --bg-alt: #161412;
      --bg-card: #24211e;
      --text: #f5efe7;
      --text-secondary: #c9bfb4;
      --text-muted: #a89f97;
      --text-subtle: #8a807a;
      --border: #3a342f;
      --border-subtle: #2a2724;
      --border-strong: #4a433c;
      --star: #ffb400;
      --stars-empty: #6d655f;
      --highlight-bg: linear-gradient(180deg, #2a1c1a 0%, #24211e 100%);
      --highlight-border: #4a2a27;
      --ghost-hover-bg: #24211e;
      --ghost-hover-border: #6d655f;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, color 0.2s;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ── THEME TOGGLE ── */
    .theme-toggle {
      position: fixed;
      top: 16px; right: 16px;
      z-index: 100;
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }
    .theme-toggle:hover { border-color: var(--border-strong); }
    .theme-toggle svg { width: 18px; height: 18px; display: none; }
    /* Default (no data-theme): derive from OS preference */
    .theme-toggle .icon-sun { display: block; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .icon-sun { display: none; }
      :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: block; }
    }
    :root[data-theme="light"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="light"] .theme-toggle .icon-moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

    /* ── HERO ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 96px 24px 72px;
    }
    .hero-icon {
      width: 88px; height: 88px; border-radius: 20px; margin-bottom: 28px;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.12;
      max-width: 740px;
      margin-bottom: 20px;
      text-wrap: balance;
    }
    .hero h1 .em { color: var(--accent); }
    .hero .tagline {
      font-size: clamp(1.05rem, 2.2vw, 1.2rem);
      color: var(--text-secondary);
      max-width: 600px;
      margin-bottom: 36px;
      line-height: 1.55;
      text-wrap: pretty;
    }
    .cta-row {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      margin-bottom: 22px;
    }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--accent); color: #fff;
      font-size: 1rem; font-weight: 600;
      padding: 14px 28px; border-radius: 8px; border: 0;
      transition: background 0.2s;
      text-align: left; line-height: 1.25;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary .btn-sub { display: block; font-size: 0.8125rem; font-weight: 500; opacity: 0.85; margin-top: 2px; }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; color: var(--text);
      font-size: 1rem; font-weight: 600;
      padding: 13px 24px; border-radius: 8px;
      border: 1px solid var(--border);
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-ghost:hover { border-color: var(--ghost-hover-border); background: var(--ghost-hover-bg); }
    /* ── HERO STATS ──
       Replaces the old .social-proof rating link. Three numbers in one row,
       the deletions total first. NOT a flex container at the number level: a
       flex parent turns every bare text node into its own item, and
       .hero-stat-num deliberately holds "<span>112,000</span>+" as mixed
       content. Keep it block, not flex. */
    .hero-stats {
      display: flex; flex-wrap: wrap; align-items: baseline;
      /* Fluid gap, no breakpoint: the three stats are ~291px of content, so a
         fixed 44px gutter overflows a 375px phone by 4px and orphans the third
         onto its own row. 6vw closes to ~22px there and clamps back to 44px on
         desktop. */
      justify-content: center; gap: 10px clamp(20px, 6vw, 44px); margin-bottom: 22px;
    }
    .hero-stat { display: block; text-align: center; text-decoration: none; color: inherit; }
    a.hero-stat:hover .hero-stat-label { color: var(--text-secondary); text-decoration: underline; }
    .hero-stat-num {
      display: block; font-size: 1.7rem; font-weight: 700; line-height: 1.15;
      color: var(--text); letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .hero-stat-star { color: var(--star); margin-left: 2px; font-size: 1.2rem; }
    .hero-stat-label {
      display: block; margin-top: 3px;
      font-size: 0.78rem; color: var(--text-muted); white-space: nowrap;
    }
    .hero-trust-row {
      display: inline-flex; flex-wrap: wrap; align-items: center;
      justify-content: center; gap: 8px 14px;
    }
    .hero-trust-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.78rem; color: var(--text-muted);
      border: 1px solid var(--border-subtle); border-radius: 999px;
      padding: 4px 10px; background: var(--bg-card);
    }
    .hero-trust-pill svg { color: var(--text-subtle); flex-shrink: 0; }
    /* A flex container makes an anonymous item out of every bare text node, so
       a label split by an inline <span> would break into separate items and
       stack. Keep each pill's label inside ONE element and stop it wrapping. */
    .hero-trust-pill > span { white-space: nowrap; }

    /* ── HERO PRODUCT SHOT ──
       The screenshot is a light-theme capture, so in dark mode it is a bright
       rectangle no matter what. It is framed rather than filtered: a filter
       would misrepresent what the product actually looks like. The padded
       surround gives it an edge to sit against in both themes. */
    .hero-shot {
      margin: 44px auto 0;
      max-width: 835px;                 /* image + 2x24px surround */
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 12px 4px;
      box-shadow: var(--shadow-accent);
    }
    .hero-shot img {
      display: block; width: 100%; height: auto;
      border-radius: 8px; border: 1px solid var(--border-subtle);
    }
    .hero-shot figcaption {
      font-size: 0.82rem; color: var(--text-muted);
      padding: 10px 6px 8px; text-wrap: pretty;
    }

    /* ── BEFORE / AFTER ──
       No connecting arrow between the columns on purpose: it would still point
       sideways once they stack, and this codebase has no width media queries to
       reorient it with. The two states are distinguished by styling instead. */
    .beforeafter { background: var(--bg-alt); }
    .ba-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      align-items: stretch;
    }
    .ba-col {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 22px;
    }
    .ba-col.ba-after { background: var(--highlight-bg); border-color: var(--highlight-border); }
    .ba-head {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-subtle); margin-bottom: 14px;
    }
    .ba-after .ba-head { color: var(--accent); }
    .ba-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .ba-col li {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 0.95rem; line-height: 1.5; text-wrap: pretty;
    }
    .ba-col li::before {
      flex-shrink: 0; font-weight: 700; line-height: 1.45;
    }
    .ba-before li { color: var(--text-muted); }
    .ba-before li::before { content: "\00d7"; color: var(--text-subtle); }
    .ba-after li { color: var(--text); }
    .ba-after li::before { content: "\2713"; color: var(--accent); }

    /* ── SECTION SHARED ── */
    section { padding: 88px 24px; }
    .section-inner { max-width: 1040px; margin: 0 auto; }
    .section-label {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 12px;
    }
    .section-heading {
      font-size: clamp(1.6rem, 3.5vw, 2.25rem);
      font-weight: 700; letter-spacing: -0.02em; line-height: 1.2;
      margin-bottom: 40px;
    }

    /* ── FEATURES ── */
    .features { background: var(--bg-alt); }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .feature-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 26px 22px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .feature-card:hover { border-color: var(--border-strong); }
    .feature-card.highlight {
      border-color: var(--highlight-border); background: var(--highlight-bg);
    }
    .feature-icon {
      color: var(--accent); margin-bottom: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--feature-icon-bg);
    }
    .feature-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
    .feature-card p { font-size: 0.92rem; color: var(--text-muted); line-height: 1.55; }
    .feature-card .pill {
      display: inline-block; margin-top: 10px;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent);
    }

    /* ── FEATURES: MINI TIER ── */
    .features-sublabel {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-subtle);
      margin-top: 56px;
      margin-bottom: 16px;
    }
    .features-mini-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .feature-mini {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 16px 18px;
      transition: border-color 0.2s;
    }
    .feature-mini:hover { border-color: var(--border); }
    .feature-mini .feature-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      margin-bottom: 10px;
      color: var(--accent);
      background: var(--feature-icon-bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .feature-mini .feature-icon svg { width: 16px; height: 16px; }
    .feature-mini h3 {
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }
    .feature-mini p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .features-tail {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-subtle);
      margin-top: 32px;
      line-height: 1.6;
      text-wrap: pretty;
    }

    /* ── HOW IT WORKS ── */
    .steps {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 32px;
    }
    .step { display: flex; align-items: flex-start; gap: 14px; }
    .step-icon {
      flex-shrink: 0; width: 44px; height: 44px; border-radius: 10px;
      background: var(--bg-card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; color: var(--accent);
    }
    .step-num {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-subtle); margin-bottom: 4px;
    }
    .step h3 { font-size: 0.95rem; font-weight: 600; }

    /* ── TESTIMONIALS ── */
    .testimonials { background: var(--bg-alt); }
    .testimonials-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px; align-items: stretch;
    }
    .testimonial {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 22px 22px;
      display: flex; flex-direction: column; gap: 14px;
      height: 100%;
    }
    .testimonial .stars { color: var(--star); letter-spacing: 3px; font-size: 0.95rem; }
    .testimonial .stars-empty { color: var(--stars-empty); letter-spacing: 3px; font-size: 0.95rem; }
    .testimonial blockquote {
      font-size: 0.98rem; color: var(--text); line-height: 1.55;
      flex: 1; font-style: normal;
    }
    .testimonial .author {
      font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 6px; flex-wrap: wrap;
    }
    .testimonial .author .name { color: var(--text-secondary); font-weight: 500; }
    .testimonial .author .source { color: var(--text-subtle); }
    .testimonial .author a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--border);
      text-underline-offset: 3px;
      transition: text-decoration-color 0.2s, color 0.2s;
    }
    .testimonial .author a:hover {
      color: var(--text-secondary);
      text-decoration-color: var(--ghost-hover-border);
    }

    /* ── WALL OF LOVE ── */
    .wall-of-love-label {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-subtle);
      margin-top: 56px; margin-bottom: 16px;
    }
    .wall-of-love-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .wall-blurb {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .wall-blurb blockquote {
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.5;
      font-style: normal;
    }
    .wall-blurb .meta {
      font-size: 0.78rem;
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .wall-blurb .meta .stars {
      color: var(--star);
      letter-spacing: 2px;
      font-size: 0.75rem;
    }
    .wall-blurb .meta .author-name {
      color: var(--text-secondary);
      font-weight: 500;
    }
    .wall-blurb .meta a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--border);
      text-underline-offset: 3px;
      transition: text-decoration-color 0.2s, color 0.2s;
    }
    .wall-blurb .meta a:hover {
      color: var(--text-secondary);
      text-decoration-color: var(--ghost-hover-border);
    }

    /* ── REVIEWS CAROUSEL ──
       Enhancement only. Without .is-on (added by scripts-reviews.html) none of
       this applies and the markup stays the plain .testimonials-grid above.
       Nothing here hides a slide: off-screen cards are scrolled out of the
       container's box, not display:none'd, so they keep real dimensions, stay
       keyboard-reachable, and stay readable to crawlers that don't run JS.
       Deliberately introduces no new custom properties — the dark-mode token
       block is duplicated in two places and this avoids touching both. */
    .reviews.is-on .testimonials-grid {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      overscroll-behavior-x: contain;   /* else h-overscroll fires browser Back */
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 4px;              /* so focus rings aren't clipped */
    }
    .reviews.is-on .testimonials-grid::-webkit-scrollbar { width: 0; height: 0; }
    .reviews.is-on .testimonials-grid:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px;
    }
    .reviews.is-on .testimonial {
      flex: 0 0 calc((100% - 32px) / 3);  /* 3-up at 1040px, two 16px gaps */
      min-width: 280px;                   /* collapses to 2- then 1-up, no media query */
      scroll-snap-align: start;
      /* The grid state sets height:100%, which in a flex row is an explicit
         height and therefore beats align-items:stretch — cards end up ragged.
         auto hands sizing back to stretch so every card matches the tallest. */
      height: auto;
    }

    .reviews-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 22px; flex-wrap: wrap;
    }
    .reviews-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
      display: inline-flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }
    .reviews-btn:hover { border-color: var(--border-strong); }
    .reviews-btn svg { width: 16px; height: 16px; }
    .reviews-dots {
      display: flex; align-items: center; justify-content: center;
      gap: 2px; flex-wrap: wrap;
    }
    /* 24x24 hit area (WCAG 2.2 SC 2.5.8); the visible dot is the pseudo-element. */
    .reviews-dot {
      width: 24px; height: 24px; padding: 0; border: 0; background: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .reviews-dot::before {
      content: ""; width: 8px; height: 8px; border-radius: 999px;
      background: var(--stars-empty); transition: background 0.2s, width 0.2s;
    }
    .reviews-dot[aria-current="true"]::before { width: 22px; background: var(--accent); }
    .reviews-btn:focus-visible, .reviews-dot:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* ── FAQ ── */
    .faq { max-width: 720px; margin: 0 auto; }
    .faq-list { border-top: 1px solid var(--border-subtle); }
    .faq-item { border-bottom: 1px solid var(--border-subtle); }
    .faq-q {
      width: 100%; text-align: left; background: transparent; border: 0;
      color: var(--text); font-size: 1rem; font-weight: 600;
      padding: 20px 0; display: flex; justify-content: space-between;
      align-items: center; gap: 20px;
    }
    .faq-q:hover { color: var(--accent); }
    .faq-q .plus {
      color: var(--accent); font-size: 1.3rem; line-height: 1; font-weight: 300;
      transition: transform 0.2s;
    }
    .faq-item[aria-expanded="true"] .plus { transform: rotate(45deg); }
    .faq-a {
      max-height: 0; overflow: hidden;
      transition: max-height 0.25s ease, padding 0.25s ease;
      color: var(--text-muted); font-size: 0.95rem; line-height: 1.65;
    }
    .faq-item[aria-expanded="true"] .faq-a {
      /* 1200px, not 600: the longest answers (privacy, Gemini Notebook) exceed
         600px of rendered height at a 375px viewport and would clip. */
      max-height: 1200px; padding: 0 0 20px;
    }

    /* ── SUPPORT ── */
    #support .section-heading { margin-bottom: 12px; }
    .support-sub {
      text-align: center;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.55;
      max-width: 520px;
      margin: 0 auto 36px;
    }
    .support-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      max-width: 820px;
      margin: 0 auto;
    }
    .support-card { display: flex; flex-direction: column; }
    .support-card .support-list {
      margin: 0; padding: 0; list-style: none;
      display: flex; flex-direction: column; gap: 10px;
    }
    .support-card .support-list li {
      position: relative;
      padding-left: 16px;
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.55;
    }
    .support-card .support-list li::before {
      content: "";
      position: absolute;
      left: 0; top: 0.6em;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }
    .support-cta {
