  <script>
    // FAQ accordion
    document.querySelectorAll('.faq-q').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.faq-item');
        const open = item.getAttribute('aria-expanded') === 'true';
        item.setAttribute('aria-expanded', open ? 'false' : 'true');
      });
    });
    // A link straight to a question (/pricing/#cancel, from the extension's
    // About modal) lands on a closed row; open it.
    const asked = location.hash && document.getElementById(location.hash.slice(1));
    if (asked && asked.classList.contains('faq-item')) asked.setAttribute('aria-expanded', 'true');

    // Theme toggle
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    function currentTheme() {
      const attr = root.getAttribute('data-theme');
      if (attr === 'light' || attr === 'dark') return attr;
      return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    toggle.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });

    // Phone menu. The links live in a drawer below 640px; above it the CSS
    // shows them inline and this never fires, because the button is
    // display:none and cannot be clicked.
    const menuBtn = document.getElementById('siteMenuBtn');
    const menu = document.getElementById('siteMenu');
    if (menuBtn && menu) {
      const setMenu = (open) => {
        menu.classList.toggle('is-open', open);
        menuBtn.setAttribute('aria-expanded', String(open));
      };
      menuBtn.addEventListener('click', () => {
        setMenu(menuBtn.getAttribute('aria-expanded') !== 'true');
      });
      // Escape closes and returns focus to the button that opened it.
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menuBtn.getAttribute('aria-expanded') === 'true') {
          setMenu(false);
          menuBtn.focus();
        }
      });
      // A tap anywhere else closes it. Following a link does too — same-page
      // anchors do not reload, so the drawer would otherwise stay open over
      // the section the visitor just asked to see.
      document.addEventListener('click', (e) => {
        if (menuBtn.getAttribute('aria-expanded') !== 'true') return;
        if (e.target.closest('#siteMenu a')) { setMenu(false); return; }
        if (!e.target.closest('#siteMenu, #siteMenuBtn')) setMenu(false);
      });
      // Leaving the breakpoint must not strand it open: the CSS stops applying
      // and the drawer would reappear as a stray inline row.
      matchMedia('(max-width: 640px)').addEventListener('change', (e) => {
        if (!e.matches) setMenu(false);
      });
    }

    // Demo video: build the iframe on click, never before.
    //
    // The point of the facade is that no request reaches Google until the visitor
    // asks for one, so this handler is the only place a YouTube URL may appear.
    // youtube-nocookie.com is the privacy-enhanced host: it serves the same player
    // without the advertising cookies. Keep both properties — swapping in the
    // ordinary domain, or pre-creating the iframe hidden, quietly undoes it.
    document.querySelectorAll('.video-facade').forEach(facade => {
      facade.addEventListener('click', () => {
        const id = facade.dataset.videoId;
        if (!id) return;
        const frame = document.createElement('iframe');
        frame.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0';
        frame.title = 'TidyWL demo';
        frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        frame.allowFullscreen = true;
        facade.replaceWith(frame);
        document.getElementById('video-note')?.remove();
      });
    });

    // Live usage counters. /api/stats is the same origin as this page — the
    // apex is proxied, /api/* routes to the Worker — so this is a plain
    // relative fetch with no CORS involved.
    //
    // The figures in the HTML are floors written daily into _data/usage.yml by
    // .github/workflows/update-usage-total.yml, rounded down to the nearest
    // 1,000, and every place that renders one says "over" or carries a "+", so
    // a stale fallback stays true. Nothing here is hand-maintained and nothing
    // here should be: the last hand-written floor went 39% stale in a day.
    //
    // This hydration is for humans only. Most AI crawlers do not run
    // JavaScript, so the numbers they index are the ones in the markup, not
    // the ones this replaces them with — which is why the workflow, not this
    // block, is what keeps the published numbers honest.
    //
    // On any failure each figure is left alone rather than blanked.
    const liveCounters = [
      ['videos-cleaned', 'deleted'],
      ['likes-removed', 'unliked'],
      ['videos-moved', 'moved'],
    ].map(([id, key]) => [document.getElementById(id), key]).filter(([el]) => el);

    if (liveCounters.length) {
      fetch('/api/stats')
        .then(r => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
        .then(d => {
          liveCounters.forEach(([el, key]) => {
            const n = d[key];
            if (Number.isFinite(n) && n > 0) el.textContent = n.toLocaleString('en-US');
          });
        })
        .catch(() => {});
    }
  </script>
