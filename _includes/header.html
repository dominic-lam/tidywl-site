  <!-- ── SITE HEADER ──
       One row on every page including the landing page: wordmark home link,
       the content pages, one CTA. The legal pages (privacy, terms, refunds)
       stay in the footer on purpose — five more links here stops it being a
       minimal header. -->
  <header class="site-header">
    <a class="site-header-home" href="/" aria-label="TidyWL home">
      <img src="/assets/icon128.png" alt="" class="site-header-icon" width="28" height="28">
      <span class="site-header-wordmark">TidyWL</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="/pricing/"{% if page.url == '/pricing/' %} aria-current="page"{% endif %}>Pricing</a>
      <a href="/firefox/"{% if page.url == '/firefox/' %} aria-current="page"{% endif %}>Firefox</a>
      <a href="/blog/"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Blog</a>
      <a class="site-nav-cta" href="https://chromewebstore.google.com/detail/fkelmapobieliokjcmnilmjllacmbfjo" target="_blank" rel="noopener">Add to Chrome</a>
    </nav>
  </header>
