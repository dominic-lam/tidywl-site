<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to pricing — TidyWL</title>
  <!--
    The pricing page moved /pro/ -> /pricing/ on 2026-09-03, to match the
    convention payment providers and their reviewers expect.

    This stub is permanent and must not be deleted. Every TidyWL 2.0 build has
    https://tidywl.com/pro/ compiled into its Pro upsell, and an installed
    extension cannot be edited after the fact — a user on the shipped version
    clicking "See TidyWL Pro" lands here forever. Older external links (the
    Paddle application, Discord posts, the store listing) point here too.

    GitHub Pages serves this site and cannot issue a real 301, so this is the
    meta-refresh + canonical pattern jekyll-redirect-from generates, written by
    hand to avoid a plugin for one page. The canonical tag is what consolidates
    search ranking onto /pricing/; noindex keeps the stub itself out of results.
  -->
  <link rel="canonical" href="https://tidywl.com/pricing/">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=/pricing/">
  <script>location.replace("/pricing/" + location.search + location.hash);</script>
  <style>
    body { font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           margin: 0; padding: 3rem 1.5rem; text-align: center; }
  </style>
</head>
<body>
  <!-- Shown only if both the refresh and the script are blocked. -->
  <p>TidyWL Pro pricing has moved to <a href="/pricing/">tidywl.com/pricing</a>.</p>
</body>
</html>
