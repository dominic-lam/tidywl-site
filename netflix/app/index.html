<!doctype html>
<!--
  TidyWL for Netflix — your synced playlists on your phone, read-only.
  Contract: tidywl-netflix/docs/claude/PLAN-mobile-sync.md § The phone.

  No front matter on purpose: Jekyll copies this file as it is. Everything the
  page shows comes from /api/netflix/phone with this phone's own pass, which
  the extension's one-time code was swapped for. The licence key never reaches
  a phone. Titles, names and box art are other people's text and Netflix's
  links, so app.js builds every node with textContent, never innerHTML.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Playlists">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Netflix Playlists</title>
  <meta name="description" content="Your TidyWL for Netflix playlists on your phone.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="/assets/netflix-icon128.png">
  <link rel="apple-touch-icon" href="/assets/netflix-icon128.png">
  <style>
    :root {
      --bg: #f6f6f6;
      --surface: #ffffff;
      --text: #141414;
      --muted: #5f5f5f;
      --line: #dddddd;
      --accent: #e50914;
      --accent-fill: #c40812;
      --accent-text: #b20710;
      --danger: #b20710;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141414;
        --surface: #1f1f1f;
        --text: #f2f2f2;
        --muted: #a8a8a8;
        --line: #333333;
        --accent-text: #ff5a5f;
        --danger: #ff6b6b;
      }
    }
    :root[data-theme="dark"] {
      --bg: #141414; --surface: #1f1f1f; --text: #f2f2f2; --muted: #a8a8a8; --line: #333333;
      --accent-text: #ff5a5f; --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    h2 { font-size: 18px; margin: 0; }
    p { margin: 0 0 12px; }
    a { color: var(--accent-text); }
    button { font: inherit; }

    .chip {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 4px 0 16px; font-size: 14px; color: var(--muted);
    }
    .chip-mark {
      width: 28px; height: 28px; border-radius: 6px; flex: none;
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
    }
    .chip strong { color: var(--text); font-weight: 600; }

    .note { font-size: 14px; color: var(--muted); }
    .error { color: var(--danger); }
    .banner {
      padding: 10px 12px; margin: 0 0 16px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--line); font-size: 14px;
    }

    .pair { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 16px; margin-top: 16px; }
    .pair ol { padding-left: 20px; margin: 0 0 16px; }
    .pair li { margin-bottom: 6px; }
    .pair form { display: flex; gap: 8px; flex-wrap: wrap; }
    .pair input {
      flex: 1 1 160px; min-width: 0; padding: 12px; font-size: 22px; letter-spacing: 0.15em; text-transform: uppercase;
      font-family: ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--text);
    }
    .btn {
      padding: 12px 18px; border: 0; border-radius: 8px; background: var(--accent-fill); color: #fff; font-weight: 600;
    }
    .btn[disabled] { opacity: 0.6; }
    .link { background: none; border: 0; padding: 0; color: var(--accent-text); text-decoration: underline; cursor: pointer; }

    .lists { list-style: none; margin: 0; padding: 0; }
    .lists li + li { margin-top: 8px; }
    .list-btn {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px; text-align: left;
      background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    }
    .list-btn .count { margin-left: auto; color: var(--muted); font-size: 14px; flex: none; }
    .list-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }

    .back { display: inline-block; margin: 4px 0 12px; }
    .grid { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .card a { display: block; color: var(--text); text-decoration: none; }
    .art {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px;
      background: var(--surface); border: 1px solid var(--line);
    }
    .art-none { display: grid; place-items: center; color: var(--muted); font-size: 12px; padding: 8px; text-align: center; }
    .card-title { font-size: 14px; margin-top: 6px; line-height: 1.3; overflow-wrap: anywhere; }
    .card-meta { font-size: 12px; color: var(--muted); }

    footer { margin: 32px 0 16px; font-size: 13px; color: var(--muted); }
    footer p { margin-bottom: 8px; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite">
    <noscript><p>This page needs JavaScript to show your playlists.</p></noscript>
  </main>
  <script src="app.js"></script>
</body>
</html>
